name: Run PHPUnit Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  phpunit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Install Node.js dependencies and build
        run: |
          cd laravel
          npm ci
          npm run build

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"

      - name: Set Laravel APP_KEY
        run: echo "APP_KEY=${{ secrets.APP_KEY }}" >> $GITHUB_ENV

      - name: Install PHP dependencies
        run: |
          cd laravel
          composer install --no-progress
          # .env が無いとテスト時に読み込み警告が出るため雛形をコピー（APP_KEY は上の環境変数が優先される）
          cp .env.example .env

      - name: Run PHPUnit Tests
        run: |
          cd laravel
          php artisan test
