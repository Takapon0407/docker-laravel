name: Run PHPUnit Tests

on:
  pull_request:
  # main へのデプロイ（deploy.yml）からも呼び出し、通った場合だけデプロイする
  workflow_call:

permissions:
  contents: read

jobs:
  phpunit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Install Node.js dependencies and build
        run: |
          cd laravel
          npm ci
          npm run build

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"

      - name: Install PHP dependencies
        run: |
          cd laravel
          composer install --no-progress
          # .env が無いとテスト時に読み込み警告が出るため雛形をコピーし、
          # テスト専用の使い捨て APP_KEY を生成する（本番の鍵や GitHub Secrets は使わない）
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Run PHPUnit Tests
        run: |
          cd laravel
          php artisan test
