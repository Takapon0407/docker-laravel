name: Dependency audit

# 依存パッケージの既知の脆弱性を確認する
# （デプロイの条件にはしない。新しい脆弱性が公開されただけで無関係のデプロイが止まらないようにするため）
on:
  pull_request:
    paths:
      - laravel/composer.lock
      - laravel/package-lock.json
  schedule:
    # 毎週月曜 9:00（JST）
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      # lock ファイルだけを見るため、依存パッケージのインストール（スクリプトの実行）はしない
      - name: Audit PHP dependencies
        working-directory: laravel
        run: composer audit --locked

      - name: Audit Node.js dependencies
        working-directory: laravel
        run: npm audit --package-lock-only --audit-level=high
