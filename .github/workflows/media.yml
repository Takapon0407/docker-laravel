name: Media (CDK)

# 作品の音源の配信と転送量の上限（infra/media）のテスト
# デプロイは管理者が手で行う（infra/media/README.md）。めったに変えないため、CI では diff・デプロイをしない
on:
  pull_request:
    paths:
      - "infra/media/**"
      - ".github/workflows/media.yml"
  push:
    branches:
      - develop
      - main
    paths:
      - "infra/media/**"
      - ".github/workflows/media.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: infra/media

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: infra/media/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # AWS の認証情報なしで synth できることも確かめる
      - name: Synth
        run: npm run synth
