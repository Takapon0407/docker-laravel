name: Board (CDK)

# 匿名質問ボードのバックエンド（infra/board）のテスト・diff・デプロイ（Issue #259）
# - PR：テスト・synth、dev / prod との diff を PR にコメント
# - develop への push：dev にデプロイ（Environment「board-dev」）
# - main への push：Environment「production」の承認後に prod にデプロイ
on:
  pull_request:
    paths:
      - "infra/board/**"
      - ".github/workflows/board.yml"
  push:
    branches:
      - develop
      - main
    paths:
      - "infra/board/**"
      - ".github/workflows/board.yml"

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-1
  DIFF_ROLE_ARN: arn:aws:iam::945611748417:role/github-actions-board-diff
  DEPLOY_ROLE_ARN: arn:aws:iam::945611748417:role/github-actions-board-deploy

defaults:
  run:
    working-directory: infra/board

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: infra/board/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # AWS の認証情報なしで synth できることも確かめる
      - name: Synth
        run: npm run synth

  # 同じリポジトリのブランチからの PR だけ（フォーク・Dependabot の PR には OIDC のトークンが渡らない）
  diff:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: infra/board/package-lock.json

      # AWS の権限を持つジョブでは、依存パッケージのインストール時のスクリプトを動かさない
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.DIFF_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # diff 用のロールは読み取りだけ（lookup のロール）のため、変更セットは作らずテンプレートどうしで比べる
      - name: Diff
        run: |
          status=0
          for stack in BoardStack-dev BoardStack-prod; do
            npx cdk diff "$stack" --no-change-set --no-color > "$RUNNER_TEMP/$stack.txt" 2>&1 || status=1
            # PR のコメントの上限（65,536 文字）に収まるよう、1 スタック 30,000 バイトまでにする
            { echo "### $stack"; echo '```'; head -c 30000 "$RUNNER_TEMP/$stack.txt"; echo; echo '```'; } >> "$RUNNER_TEMP/diff.md"
          done
          cat "$RUNNER_TEMP/diff.md"
          exit "$status"

      - name: Upload diff
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: board-diff
          path: ${{ runner.temp }}/diff.md

  # コメントは AWS の権限を持たないジョブで書く
  comment:
    needs: diff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Download diff
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: board-diff
          path: ${{ runner.temp }}

      # 前に書いたコメントがあれば書き換え、なければ新しく書く
      - name: Comment on PR
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          { echo "## 匿名質問ボード（CDK）の diff"; echo; echo "対象のコミット：$COMMIT_SHA"; echo; cat diff.md; } > comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file comment.md --edit-last --create-if-none

  deploy-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: board-dev
    concurrency:
      group: board-deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: infra/board/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy
        run: npx cdk deploy BoardStack-dev --require-approval never --no-color

  deploy-prod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 承認する人とブランチ（main だけ）は Environment の設定で決める
    environment: production
    concurrency:
      group: board-deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: infra/board/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy
        run: npx cdk deploy BoardStack-prod --require-approval never --no-color
