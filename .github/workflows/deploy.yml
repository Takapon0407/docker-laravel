name: Deploy to EC2

on:
  push:
    branches:
      - main

permissions:
  contents: read

# デプロイが同時に走らないようにする
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  DEPLOY_ROLE_ARN: arn:aws:iam::945611748417:role/github-actions-deploy-tektektech
  ARTIFACT_BUCKET: tektektech-deploy-artifacts
  INSTANCE_ID: i-0006d1df01ceb7dc0

jobs:
  # テストと静的解析が通らなければビルド・デプロイしない
  test:
    uses: ./.github/workflows/test.yml

  lint:
    uses: ./.github/workflows/lint.yml

  # ビルド（npm / composer のスクリプトが動く）は AWS の権限を持たないジョブで行う
  build:
    needs: [test, lint]
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      # サードパーティ製を含むアクションはすべてコミットSHAで固定（タグ/ブランチの書き換えによる改ざん対策）
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Install Node.js dependencies and build assets
        run: |
          cd laravel
          npm ci
          npm run build

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"

      - name: Install PHP dependencies
        run: |
          cd laravel
          composer install --no-dev --optimize-autoloader --no-progress

      - name: Package release
        id: package
        run: |
          tar czf "$RUNNER_TEMP/release.tar.gz" \
            --exclude=./.git \
            --exclude=./laravel/node_modules \
            --exclude=./laravel/storage \
            .
          echo "sha256=$(sha256sum "$RUNNER_TEMP/release.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release.tar.gz
          retention-days: 1

  # デプロイは OIDC で AWS の権限を持つが、パッケージ管理のコード（npm / composer）は一切実行しない
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # GitHub OIDC で AWS の IAM ロールを引き受けるために必要（アクセスキーは使わない）
      id-token: write
    env:
      RELEASE_SHA256: ${{ needs.build.outputs.sha256 }}
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}

      - name: Verify release checksum
        run: echo "$RELEASE_SHA256  $RUNNER_TEMP/release.tar.gz" | sha256sum -c -

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload release to S3
        run: |
          aws s3 cp "$RUNNER_TEMP/release.tar.gz" "s3://$ARTIFACT_BUCKET/releases/$GITHUB_SHA.tar.gz" --only-show-errors

      # SSH を使わず、SSM Run Command で EC2 上のデプロイスクリプトを実行する
      # EC2 側でも sha256 を照合してから展開する（S3 上で差し替えられたファイルは実行しない）
      - name: Deploy to EC2 via SSM
        run: |
          cat > "$RUNNER_TEMP/params.json" <<EOF
          {
            "commands": [
              "set -euo pipefail",
              "TMP=\$(mktemp -d)",
              "trap 'rm -rf \"\$TMP\"' EXIT",
              "aws s3 cp s3://$ARTIFACT_BUCKET/releases/$GITHUB_SHA.tar.gz \"\$TMP/release.tar.gz\" --region $AWS_REGION --only-show-errors",
              "echo \"$RELEASE_SHA256  \$TMP/release.tar.gz\" | sha256sum -c -",
              "mkdir \"\$TMP/release\"",
              "tar xzf \"\$TMP/release.tar.gz\" -C \"\$TMP/release\"",
              "bash \"\$TMP/release/deploy/remote-deploy.sh\" \"\$TMP/release\""
            ],
            "executionTimeout": ["900"]
          }
          EOF
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy $GITHUB_SHA" \
            --parameters "file://$RUNNER_TEMP/params.json" \
            --query Command.CommandId --output text)
          echo "SSM command: $COMMAND_ID"

          # 終了状態になるまで待つ（aws ssm wait は約100秒で打ち切られ、遅いビルドでジョブだけ失敗するため自前で待つ）
          STATUS=Pending
          for i in $(seq 1 100); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Pending|InProgress|Delayed) ;;
              *) break ;;
            esac
          done

          RESULT=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID")
          echo "::group::stdout"; echo "$RESULT" | jq -r .StandardOutputContent; echo "::endgroup::"
          echo "::group::stderr"; echo "$RESULT" | jq -r .StandardErrorContent; echo "::endgroup::"
          echo "Status: $STATUS"
          test "$STATUS" = "Success"
