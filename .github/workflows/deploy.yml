name: Deploy to EC2

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # サードパーティ製を含むアクションはすべてコミットSHAで固定（タグ/ブランチの書き換えによる改ざん対策）
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Install Node.js dependencies and build React App
        run: |
          cd laravel
          npm ci
          npm run build

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"

      - name: Install PHP dependencies
        run: |
          cd laravel
          composer install --no-dev --optimize-autoloader --no-progress

      # scp は上書きのみで、リポジトリから消したファイル（設定・パッケージ等）がEC2に残り続けるため、
      # リポジトリ/ビルドから毎回再生成されるディレクトリだけ事前に削除する（storage と .env は残す）
      - name: Remove old app code on EC2
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ec2-user/tektektech/laravel || exit 0
            sudo rm -rf app bootstrap config database lang resources routes vendor public/build

      - name: Transfer root files to EC2
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "/home/ec2-user/tektektech"

      # .env の復号はEC2上でのみ行う（runner上に平文の.envを残さない）
      - name: Deploy to EC2
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          ENCRYPTION_SECRET: ${{ secrets.ENCRYPTION_SECRET }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ENCRYPTION_SECRET
          script: |
            set -e
            cd /home/ec2-user/tektektech/laravel
            sudo chmod -R 777 storage
            # パスフレーズはコマンド引数ではなく環境変数で渡す（ps等に表示させない）
            openssl aes-256-cbc -d -pbkdf2 -iter 10000 -in .env.production.enc -out .env -pass env:ENCRYPTION_SECRET
            cd /home/ec2-user/tektektech
            # ベースイメージ（php / nginx）は毎回最新のパッチ版を取得してからビルド・起動する
            docker compose build --pull
            docker compose pull --ignore-buildable
            docker compose up -d --remove-orphans
            docker compose exec -T app php laravel/artisan config:cache
            docker image prune -f
