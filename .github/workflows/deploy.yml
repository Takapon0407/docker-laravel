name: Deploy to EC2

on:
  push:
    branches:
      - main

permissions:
  contents: read
  # GitHub OIDC で AWS の IAM ロールを引き受けるために必要（アクセスキーは使わない）
  id-token: write

# デプロイが同時に走らないようにする
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  DEPLOY_ROLE_ARN: arn:aws:iam::945611748417:role/github-actions-deploy-tektektech
  ARTIFACT_BUCKET: tektektech-deploy-artifacts
  INSTANCE_ID: i-0006d1df01ceb7dc0

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # サードパーティ製を含むアクションはすべてコミットSHAで固定（タグ/ブランチの書き換えによる改ざん対策）
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Install Node.js dependencies and build assets
        run: |
          cd laravel
          npm ci
          npm run build

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"

      - name: Install PHP dependencies
        run: |
          cd laravel
          composer install --no-dev --optimize-autoloader --no-progress

      - name: Package release
        run: |
          tar czf "$RUNNER_TEMP/release.tar.gz" \
            --exclude=./.git \
            --exclude=./laravel/node_modules \
            --exclude=./laravel/storage \
            .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload release to S3
        run: |
          aws s3 cp "$RUNNER_TEMP/release.tar.gz" "s3://$ARTIFACT_BUCKET/releases/$GITHUB_SHA.tar.gz" --only-show-errors

      # SSH を使わず、SSM Run Command で EC2 上のデプロイスクリプトを実行する
      - name: Deploy to EC2 via SSM
        run: |
          cat > "$RUNNER_TEMP/params.json" <<EOF
          {
            "commands": [
              "set -euo pipefail",
              "TMP=\$(mktemp -d)",
              "trap 'rm -rf \"\$TMP\"' EXIT",
              "aws s3 cp s3://$ARTIFACT_BUCKET/releases/$GITHUB_SHA.tar.gz \"\$TMP/release.tar.gz\" --region $AWS_REGION --only-show-errors",
              "mkdir \"\$TMP/release\"",
              "tar xzf \"\$TMP/release.tar.gz\" -C \"\$TMP/release\"",
              "bash \"\$TMP/release/deploy/remote-deploy.sh\" \"\$TMP/release\""
            ],
            "executionTimeout": ["900"]
          }
          EOF
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy $GITHUB_SHA" \
            --parameters "file://$RUNNER_TEMP/params.json" \
            --query Command.CommandId --output text)
          echo "SSM command: $COMMAND_ID"

          # 完了を待ち、成否にかかわらず実行ログを表示してから結果を判定する
          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          set -e
          RESULT=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID")
          echo "::group::stdout"; echo "$RESULT" | jq -r .StandardOutputContent; echo "::endgroup::"
          echo "::group::stderr"; echo "$RESULT" | jq -r .StandardErrorContent; echo "::endgroup::"
          STATUS=$(echo "$RESULT" | jq -r .Status)
          echo "Status: $STATUS"
          test "$STATUS" = "Success"
