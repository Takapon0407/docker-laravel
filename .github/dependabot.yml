# 依存関係の更新を毎週まとめて PR にする（セキュリティ更新は Dependabot alerts から随時）
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: composer
    directory: /laravel
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      composer:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /laravel
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]

  # CDK（匿名質問ボード・作品の音源）。aws-cdk と aws-cdk-lib はほぼ毎週出るので、まとめて 1 つの PR にする
  - package-ecosystem: npm
    directories: [/infra/board, /infra/media]
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      infra:
        update-types: [minor, patch]
