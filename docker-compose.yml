services:
  app:
    container_name: app
    build: .
    # サーバー再起動時にも自動で起動する
    restart: unless-stopped
    volumes:
      - ./laravel:/var/www/laravel
  nginx:
    image: nginx:stable
    container_name: nginx
    restart: unless-stopped
    ports:
      - 80:80
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf
      # nginxには公開ディレクトリのみマウント（.env等をnginxコンテナから見せない）
      - ./laravel/public:/var/www/laravel/public
    depends_on:
      - app
