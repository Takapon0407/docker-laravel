# 本番の構成（EC2 では docker-compose.override.yml を読まないよう、このファイルだけを指定して使う）
# コードはイメージに含め、デプロイのたびにコミットの SHA をタグにしたイメージを作ってコンテナごと入れ替える
# 残すデータ（storage）と .env だけをマウントする

# コンテナのログ（docker compose logs で見られる）は、ディスクを使い切らないようサイズと世代数を制限する
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    container_name: app
    build:
      context: .
      target: app
    image: tektektech-app:${IMAGE_TAG:-local}
    # サーバー再起動時にも自動で起動する
    restart: unless-stopped
    environment:
      # Blade のコンパイル済みビューはコンテナごとに作る（前のリリースのものを使わない）
      VIEW_COMPILED_PATH: /tmp/views
    volumes:
      - ./laravel/storage:/var/www/laravel/storage
      - ./laravel/.env:/var/www/laravel/.env:ro
    logging: *default-logging
  nginx:
    container_name: nginx
    build:
      context: .
      target: nginx
    image: tektektech-nginx:${IMAGE_TAG:-local}
    restart: unless-stopped
    ports:
      - 80:80
    logging: *default-logging
    depends_on:
      - app
