# コンテナのログ（docker compose logs で見られる）は、ディスクを使い切らないようサイズと世代数を制限する
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    container_name: app
    build: .
    # サーバー再起動時にも自動で起動する
    restart: unless-stopped
    volumes:
      - ./laravel:/var/www/laravel
    logging: *default-logging
  nginx:
    image: nginx:stable
    container_name: nginx
    restart: unless-stopped
    ports:
      - 80:80
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf
      # nginxには公開ディレクトリのみマウント（.env等をnginxコンテナから見せない）
      - ./laravel/public:/var/www/laravel/public
    logging: *default-logging
    depends_on:
      - app
