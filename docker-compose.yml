version: "3.7"
services:
  app:
    container_name: app
    build: .
    volumes:
      - ./laravel:/var/www/laravel
  nginx:
    image: nginx
    container_name: nginx
    ports:
      - 80:80
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      # nginxには公開ディレクトリのみマウント（.env等をnginxコンテナから見せない）
      - ./laravel/public:/var/www/laravel/public
    working_dir: /var/www
    depends_on:
      - app
