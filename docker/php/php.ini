[PHP]
; エラー詳細（パス・スタックトレース）を画面に出さない。Laravel のエラー表示は APP_DEBUG で制御する
display_errors = Off
log_errors = On
; レスポンスヘッダー X-Powered-By で PHP のバージョンを公開しない
expose_php = Off
; 致命的エラー時のバックトレース保持を無効化（CVE-2026-109619 の緩和策。パッチ適用後も念のため維持）
fatal_error_backtraces = Off
; ファイルアップロードは使わないため無効化
file_uploads = Off
[Date]
date.timezone = "Asia/Tokyo"
[Session]
; アップロード進捗は使わないため無効化（CVE-2026-109619 の緩和策）
session.upload_progress.enabled = Off
[mbstring]
mbstring.language = "Japanese"
[opcache]
opcache.memory_consumption=128
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=4000
opcache.revalidate_freq=60
opcache.enable_cli=1
