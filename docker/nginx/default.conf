server {
  listen 80;
  root /var/www/laravel/public;
  index index.php;
  server_tokens off;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # 閲覧者とは CloudFront で HTTPS 接続しているため、ブラウザに HTTPS のみを使わせる
  add_header Strict-Transport-Security "max-age=31536000" always;
  # インラインスクリプトや外部画像（S3）を使っているため、まずは影響のない範囲だけ制限する
  add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'" always;
  # サイトは閲覧専用（GET のみ）のため、それ以外のメソッドは PHP に渡す前に拒否する
  # （POST の本文・multipart の解析は PHP がルーティングより前に行うため、PHP 本体の脆弱性の入口を減らす）
  if ($request_method !~ ^(GET|HEAD)$) {
    return 405;
  }
  access_log /var/log/nginx/static-access.log;
  error_log /var/log/nginx/static-error.log;
  # ドットで始まるファイル・ディレクトリ（.htaccess / .env / .git など）は返さない（.well-known は除く）
  location ~ /\.(?!well-known/) {
    deny all;
  }
  location / {
    try_files $uri $uri/ /index.php?$query_string;
  }
  location ~ \.php$ {
    try_files $uri =404;
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_pass app:9000;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
  }
}
