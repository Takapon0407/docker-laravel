server {
  listen 80;
  root /var/www/laravel/public;
  index index.php;
  server_tokens off;
  include /etc/nginx/snippets/security-headers.conf;
  # サイトは閲覧専用（GET のみ）のため、それ以外のメソッドは PHP に渡す前に拒否する
  # （POST の本文・multipart の解析は PHP がルーティングより前に行うため、PHP 本体の脆弱性の入口を減らす）
  if ($request_method !~ ^(GET|HEAD)$) {
    return 405;
  }
  # ドットで始まるファイル・ディレクトリ（.htaccess / .env / .git など）は返さない（.well-known は除く）
  location ~ /\.(?!well-known/) {
    deny all;
  }
  # Vite のビルド結果はファイル名に内容のハッシュが入る（内容が変わると URL も変わる）ため、長期間キャッシュさせる
  location /build/assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
  location / {
    try_files $uri $uri/ /index.php?$query_string;
  }
  # PHP に渡すのは Laravel の入口（index.php）だけにする
  location = /index.php {
    fastcgi_pass app:9000;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
  }
  # それ以外の .php は、誤って public に置かれても実行せず 404 にする
  location ~ \.php$ {
    return 404;
  }
}
