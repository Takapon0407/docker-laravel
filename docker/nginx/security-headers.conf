# すべてのレスポンスに付けるセキュリティヘッダー
# （nginx は location 内で add_header を1つでも書くと server レベルの add_header を引き継がないため、
#   server と、独自のヘッダーを追加する location の両方からこのファイルを include する）
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# 閲覧者とは CloudFront で HTTPS 接続しているため、ブラウザに HTTPS のみを使わせる
add_header Strict-Transport-Security "max-age=31536000" always;
# カメラ・マイク・位置情報などのブラウザ機能は使わないため無効にする
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# インラインスクリプトや外部画像（S3）を使っているため、まずは影響のない範囲だけ制限する
add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'" always;
