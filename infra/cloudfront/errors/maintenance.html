<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>メンテナンス中 | てくてくてっく</title>
    <!--
      CloudFront のカスタムエラーページ（オリジンの EC2 が 502/503/504 を返したとき用）。
      EC2 が落ちていても表示できるよう S3 に置き、外部ファイルには依存しない（CSS もインライン）。
    -->
    <style>
        :root {
            --main: #55c501;
            --main-dark: #367e00;
            --bg: #f5f6f6;
            --text: #333;
            --muted: #6b7075;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; }
        body {
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue",
                "Hiragino Kaku Gothic ProN", "メイリオ", meiryo, sans-serif;
        }
        header {
            background: var(--main);
            color: #fff;
            padding: 14px 24px;
            font-size: 1.25rem;
        }
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }
        .card {
            max-width: 480px;
            width: 100%;
            background: #fff;
            border-radius: 12px;
            padding: 40px 28px;
            text-align: center;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }
        .icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 20px;
            border: 5px solid #e3f5d6;
            border-top-color: var(--main);
            border-radius: 50%;
            animation: spin 1.4s linear infinite;
        }
        h1 { font-size: 1.4rem; margin: 0 0 12px; }
        p { color: var(--muted); line-height: 1.8; margin: 0 0 24px; }
        a.button {
            display: inline-block;
            background: var(--main);
            color: #fff;
            text-decoration: none;
            padding: 10px 28px;
            border-radius: 6px;
        }
        a.button:hover { background: var(--main-dark); }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { .icon { animation: none; } }
    </style>
</head>
<body>
    <header>てくてくてっく</header>
    <main>
        <div class="card">
            <div class="icon" aria-hidden="true"></div>
            <h1>ただいまメンテナンス中です</h1>
            <p>
                サーバーのメンテナンスまたは一時的な障害のため、ページを表示できません。<br>
                しばらく時間をおいてから、もう一度アクセスしてください。
            </p>
            <a class="button" href="/">再読み込み</a>
        </div>
    </main>
</body>
</html>
